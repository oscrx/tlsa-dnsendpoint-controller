name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Cancel superseded runs on the same ref; the latest push is the one that matters.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          # Single source of truth: the toolchain comes from go.mod.
          go-version-file: go.mod
          cache: true

      - name: Verify go.mod is tidy
        run: |
          go mod tidy
          git diff --exit-code -- go.mod go.sum

      - name: Check formatting
        run: |
          unformatted=$(gofmt -l -s .)
          if [ -n "$unformatted" ]; then
            echo "These files need gofmt -s:"
            echo "$unformatted"
            exit 1
          fi

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test -race -count=1 -coverprofile=coverage.out ./...

      - name: Coverage summary
        run: go tool cover -func=coverage.out | tail -1 >> "$GITHUB_STEP_SUMMARY"

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      # The action line must understand golangci-lint v2 configs (v6 does not).
      # goinstall builds the linter from source with this repo's own toolchain.
      # The prebuilt release binaries are compiled with whatever Go was current
      # when that release was cut, and golangci-lint refuses to run when that is
      # older than the go directive in go.mod, which breaks the job every time
      # this repo moves to a new Go before upstream cuts a release. Building
      # from source costs about a minute and cannot fall behind.
      # The version stays pinned for reproducibility.
      - uses: golangci/golangci-lint-action@v9
        with:
          version: v2.13.0
          install-mode: goinstall
          args: --timeout=5m

  build:
    name: Build image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-qemu-action@v4

      - uses: docker/setup-buildx-action@v4

      # Build both platforms to catch a cross-compilation break, but do not push
      # from CI — publishing happens only from release.yaml.
      - name: Build (no push)
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max

  renovate-config:
    name: Validate Renovate config
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # Renovate rejects unknown keys and stops raising PRs entirely when its
      # config is invalid, which is silent unless you go looking. Catch it here.
      - name: Validate
        run: npx --yes --package renovate renovate-config-validator --strict renovate.json

  manifests:
    name: Validate manifests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # kubeconform validates against JSON schemas and needs no cluster, unlike
      # `kubectl --dry-run=client`, which still performs API discovery.
      - name: Install kubeconform
        run: |
          version=v0.6.7
          curl -fsSL "https://github.com/yannh/kubeconform/releases/download/${version}/kubeconform-linux-amd64.tar.gz" \
            | tar -xz -C /usr/local/bin kubeconform
          kubeconform -v

      - name: Validate
        # Built-in kinds are checked strictly. The custom resources in examples/
        # are checked against the community CRD catalogue where it has a schema,
        # and skipped where it does not — external-dns's DNSEndpoint is not
        # published there, and failing on that would make this job useless.
        run: |
          kubeconform \
            -strict \
            -summary \
            -ignore-missing-schemas \
            -schema-location default \
            -schema-location 'https://raw.githubusercontent.com/datreeio/CRDs-catalog/main/{{.Group}}/{{.ResourceKind}}_{{.ResourceAPIVersion}}.json' \
            deploy/ examples/

  chart:
    name: Chart
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: azure/setup-helm@v5

      - name: Install kubeconform
        run: |
          version=v0.6.7
          curl -fsSL "https://github.com/yannh/kubeconform/releases/download/${version}/kubeconform-linux-amd64.tar.gz" \
            | tar -xz -C /usr/local/bin kubeconform

      - name: Lint
        run: helm lint charts/tlsa-dnsendpoint-controller

      - name: Render and validate the default values
        run: |
          helm template t charts/tlsa-dnsendpoint-controller \
            | kubeconform -strict -summary -ignore-missing-schemas \
                -schema-location default \
                -schema-location 'https://raw.githubusercontent.com/datreeio/CRDs-catalog/main/{{.Group}}/{{.ResourceKind}}_{{.ResourceAPIVersion}}.json' -

      - name: Render and validate with every optional feature enabled
        run: |
          helm template t charts/tlsa-dnsendpoint-controller \
            --set replicaCount=2 \
            --set leaderElection.enabled=true \
            --set metrics.service.enabled=true \
            --set metrics.serviceMonitor.enabled=true \
            | kubeconform -strict -summary -ignore-missing-schemas \
                -schema-location default \
                -schema-location 'https://raw.githubusercontent.com/datreeio/CRDs-catalog/main/{{.Group}}/{{.ResourceKind}}_{{.ResourceAPIVersion}}.json' -

      - name: Guards reject invalid configurations
        # The chart fails fast on combinations that would misbehave at runtime.
        # Assert they still do, so a template refactor cannot quietly drop them.
        run: |
          set +e
          for args in \
            "--set replicaCount=2" \
            "--set controller.annotationPrefix=" \
            "--set metrics.enabled=false --set metrics.serviceMonitor.enabled=true"
          do
            # shellcheck disable=SC2086
            if helm template t charts/tlsa-dnsendpoint-controller $args >/dev/null 2>&1; then
              echo "guard did not fire for: $args"
              exit 1
            fi
            echo "guard fired for: $args"
          done
