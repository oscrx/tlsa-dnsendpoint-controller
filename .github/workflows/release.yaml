name: Release

on:
  push:
    tags: ["v*"]
  # Publish a moving :main tag so the latest commit is deployable without
  # cutting a release.
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read
  packages: write
  # Needed for cosign keyless signing via the GitHub OIDC provider.
  id-token: write

env:
  IMAGE: ghcr.io/${{ github.repository }}

jobs:
  image:
    name: Build and push
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # A release must never ship something that does not pass its own tests.
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Test
        run: go test -race -count=1 ./...

      - uses: docker/setup-qemu-action@v4

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Derive tags
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=ref,event=branch
            type=sha,format=long

      - name: Build and push
        id: push
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          annotations: ${{ steps.meta.outputs.annotations }}
          provenance: mode=max
          sbom: true
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Pinned to an exact release: this action publishes no floating major
      # tag, so @v4 does not resolve.
      - uses: sigstore/cosign-installer@v4.1.2

      - name: Sign the image
        # Keyless signing: the identity is this workflow, so consumers can verify
        # provenance without any long-lived key material.
        env:
          DIGEST: ${{ steps.push.outputs.digest }}
        run: cosign sign --yes "${IMAGE}@${DIGEST}"

      - uses: azure/setup-helm@v5

      - name: Package and push the chart
        id: chart
        # Only on tags: a manual dispatch publishes a moving image tag, but a
        # chart version has to correspond to a release.
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          version="${GITHUB_REF_NAME#v}"
          declared=$(helm show chart charts/tlsa-dnsendpoint-controller | awk '$1=="version:"{print $2}')
          if [ "$declared" != "$version" ]; then
            echo "Chart.yaml version ($declared) does not match the tag ($version); bump the chart before tagging."
            exit 1
          fi

          helm registry login ghcr.io -u "${{ github.actor }}" --password-stdin <<<"$GH_TOKEN"
          helm package charts/tlsa-dnsendpoint-controller --destination dist
          helm push "dist/tlsa-dnsendpoint-controller-${version}.tgz" \
            "oci://ghcr.io/${{ github.repository_owner }}/charts" 2>&1 | tee push.log

          digest=$(grep -oE 'sha256:[a-f0-9]{64}' push.log | head -1)
          echo "digest=${digest}" >> "$GITHUB_OUTPUT"
          echo "ref=ghcr.io/${{ github.repository_owner }}/charts/tlsa-dnsendpoint-controller" >> "$GITHUB_OUTPUT"
          echo "version=${version}" >> "$GITHUB_OUTPUT"

      - name: Sign the chart
        if: steps.chart.outputs.digest != ''
        env:
          REF: ${{ steps.chart.outputs.ref }}
          DIGEST: ${{ steps.chart.outputs.digest }}
        run: cosign sign --yes "${REF}@${DIGEST}"

      - name: Summary
        env:
          DIGEST: ${{ steps.push.outputs.digest }}
          TAGS: ${{ steps.meta.outputs.tags }}
          CHART_REF: ${{ steps.chart.outputs.ref }}
          CHART_VERSION: ${{ steps.chart.outputs.version }}
          CHART_DIGEST: ${{ steps.chart.outputs.digest }}
        run: |
          {
            echo "### Image"
            echo
            echo '```'
            echo "$TAGS"
            echo '```'
            echo
            echo "Digest: \`${DIGEST}\`"
            if [ -n "$CHART_REF" ]; then
              echo
              echo "### Chart"
              echo
              echo '```'
              echo "helm install tlsa oci://${CHART_REF} --version ${CHART_VERSION}"
              echo '```'
              echo
              echo "Digest: \`${CHART_DIGEST}\`"
            fi
          } >> "$GITHUB_STEP_SUMMARY"
