name: Release

on:
  push:
    tags: ["v*"]
  # Publish a moving :main tag so the latest commit is deployable without
  # cutting a release.
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

# Granted per job rather than here: with more than one job, a workflow-level
# write is handed to every job whether it needs it or not.
permissions:
  contents: read

env:
  IMAGE: ghcr.io/${{ github.repository }}

jobs:
  image:
    name: Build and push
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      # Needed for cosign keyless signing via the GitHub OIDC provider.
      id-token: write
    outputs:
      digest: ${{ steps.push.outputs.digest }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      # A release must never ship something that does not pass its own tests.
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod
          # No cache. Cache entries are writable from lower-privileged workflows,
          # so restoring one here would let a pull request influence the bytes
          # that get signed and published.
          cache: false

      - name: Test
        run: go test -race -count=1 ./...

      - uses: docker/setup-qemu-action@1f40c72289eff860ee54a304f1438e3cff362e0a # v4

      - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4

      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Derive tags
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=ref,event=branch
            type=sha,format=long

      - name: Build and push
        id: push
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          annotations: ${{ steps.meta.outputs.annotations }}
          provenance: mode=max
          sbom: true
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Pinned to an exact release: this action publishes no floating major
      # tag, so @v4 does not resolve.
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Sign the image
        # Keyless signing: the identity is this workflow, so consumers can verify
        # provenance without any long-lived key material.
        env:
          DIGEST: ${{ steps.push.outputs.digest }}
        run: cosign sign --yes "${IMAGE}@${DIGEST}"

      - name: Summary
        env:
          DIGEST: ${{ steps.push.outputs.digest }}
          TAGS: ${{ steps.meta.outputs.tags }}
        run: |
          {
            echo "### Image"
            echo
            echo '```'
            echo "$TAGS"
            echo '```'
            echo
            echo "Digest: \`${DIGEST}\`"
          } >> "$GITHUB_STEP_SUMMARY"

  # Second stage. The chart pins the image by digest, and a digest does not
  # exist until the image has been pushed, so this cannot run alongside the
  # build. Failing here leaves a published image with no chart, which is
  # recoverable by re-running; the reverse would not be.
  chart:
    name: Package and push the chart
    needs: image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      # Needed for cosign keyless signing via the GitHub OIDC provider.
      id-token: write
    # Only on tags: a manual dispatch publishes a moving image tag, but a chart
    # version has to correspond to a release.
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5

      # cosign reads ~/.docker/config.json. `helm registry login` writes helm's
      # own config, so without this the signing step gets UNAUTHORIZED even
      # though the push it just made succeeded.
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Pinned to an exact release: this action publishes no floating major
      # tag, so @v4 does not resolve.
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      # Written into the working copy only. The repository keeps digest empty,
      # because the value is specific to the image this run just published.
      - name: Pin the published image digest into the chart
        env:
          DIGEST: ${{ needs.image.outputs.digest }}
        run: |
          values=charts/tlsa-dnsendpoint-controller/values.yaml
          test -n "$DIGEST"
          sed -i "s|^  digest: \"\"$|  digest: \"${DIGEST}\"|" "$values"
          grep -q "^  digest: \"${DIGEST}\"$" "$values"
          helm template t charts/tlsa-dnsendpoint-controller | grep -F "@${DIGEST}"

      - name: Package and push the chart
        id: chart
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ACTOR: ${{ github.actor }}
          OWNER: ${{ github.repository_owner }}
        run: |
          version="${GITHUB_REF_NAME#v}"
          declared=$(helm show chart charts/tlsa-dnsendpoint-controller | awk '$1=="version:"{print $2}')
          if [ "$declared" != "$version" ]; then
            echo "Chart.yaml version ($declared) does not match the tag ($version); bump the chart before tagging."
            exit 1
          fi

          helm registry login ghcr.io -u "$ACTOR" --password-stdin <<<"$GH_TOKEN"
          helm package charts/tlsa-dnsendpoint-controller --destination dist
          helm push "dist/tlsa-dnsendpoint-controller-${version}.tgz" \
            "oci://ghcr.io/${OWNER}/charts" 2>&1 | tee push.log

          digest=$(grep -oE 'sha256:[a-f0-9]{64}' push.log | head -1)
          echo "digest=${digest}" >> "$GITHUB_OUTPUT"
          echo "ref=ghcr.io/${OWNER}/charts/tlsa-dnsendpoint-controller" >> "$GITHUB_OUTPUT"
          echo "version=${version}" >> "$GITHUB_OUTPUT"

      - name: Sign the chart
        env:
          REF: ${{ steps.chart.outputs.ref }}
          DIGEST: ${{ steps.chart.outputs.digest }}
        run: cosign sign --yes "${REF}@${DIGEST}"

      - name: Summary
        env:
          IMAGE_DIGEST: ${{ needs.image.outputs.digest }}
          CHART_REF: ${{ steps.chart.outputs.ref }}
          CHART_VERSION: ${{ steps.chart.outputs.version }}
          CHART_DIGEST: ${{ steps.chart.outputs.digest }}
        run: |
          {
            echo "### Chart"
            echo
            echo '```'
            echo "helm install tlsa oci://${CHART_REF} --version ${CHART_VERSION}"
            echo '```'
            echo
            echo "Digest: \`${CHART_DIGEST}\`"
            echo
            echo "Pins image digest \`${IMAGE_DIGEST}\`"
          } >> "$GITHUB_STEP_SUMMARY"
